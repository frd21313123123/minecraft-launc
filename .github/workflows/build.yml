name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Встраивается в бинарник и позволяет rolling-каналу `latest` отличить
  # установленную сборку от более нового коммита без риска downgrade.
  MINELAUNCHER_BUILD_COMMIT: ${{ github.sha }}

# Новая сборка той же ветки отменяет старую, чтобы mutable-релиз `latest`
# не мог быть перезаписан более старым workflow run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require tag to match Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cargo_version="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          if [[ "v${cargo_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} must match Cargo.toml version ${cargo_version}." >&2
            exit 1
          fi

  build-windows:
    name: Windows (exe)
    needs: validate-version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Package exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Force target\release\mine_launcher.exe dist\MineLauncher.exe
          Get-Item dist\MineLauncher.exe | Format-List Name, Length, LastWriteTime

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MineLauncher-windows-x64
          path: dist/MineLauncher.exe
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Linux
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev pkg-config libgtk-3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/release/mine_launcher dist/MineLauncher-linux-x64
          chmod +x dist/MineLauncher-linux-x64
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MineLauncher-linux-x64
          path: dist/MineLauncher-linux-x64
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    # Релиз: push в main/master, тег v*, или ручной запуск с main/master. Не на PR.
    if: >
      (github.event_name == 'workflow_dispatch' && (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master'
      )) ||
      (github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master' ||
        startsWith(github.ref, 'refs/tags/v')
      ))
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: MineLauncher-windows-x64
          path: release

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: MineLauncher-linux-x64
          path: release

      - name: Prepare files
        run: |
          mv release/MineLauncher.exe release/MineLauncher-windows-x64.exe
          windows_sha="$(sha256sum release/MineLauncher-windows-x64.exe | awk '{print $1}')"
          linux_sha="$(sha256sum release/MineLauncher-linux-x64 | awk '{print $1}')"
          windows_size="$(stat -c%s release/MineLauncher-windows-x64.exe)"
          linux_size="$(stat -c%s release/MineLauncher-linux-x64)"
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg windows_sha "$windows_sha" \
            --arg linux_sha "$linux_sha" \
            --argjson windows_size "$windows_size" \
            --argjson linux_size "$linux_size" \
            '{
              schema: 1,
              commit: $commit,
              assets: {
                "MineLauncher-windows-x64.exe": {
                  sha256: $windows_sha,
                  size: $windows_size
                },
                "MineLauncher-linux-x64": {
                  sha256: $linux_sha,
                  size: $linux_size
                }
              }
            }' > release/MineLauncher-update.json
          ls -lh release/

      - name: Resolve release tag and title
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=MineLauncher ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "name=Latest Build" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse stale rolling release
        if: steps.meta.outputs.tag == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq '.object.sha')"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "Refusing to publish stale rolling build $GITHUB_SHA; branch HEAD is $current_sha." >&2
            exit 1
          fi

      - name: Create / update GitHub Release
        id: publish_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          make_latest: ${{ steps.meta.outputs.make_latest }}
          overwrite_files: true
          preserve_order: true
          files: |
            release/MineLauncher-windows-x64.exe
            release/MineLauncher-linux-x64
            release/MineLauncher-update.json
          fail_on_unmatched_files: true
          body: |
            Автоматическая сборка MineLauncher.

            | Файл | Платформа |
            |------|-----------|
            | `MineLauncher-windows-x64.exe` | Windows |
            | `MineLauncher-linux-x64` | Linux |

            Commit: `${{ github.sha }}`

      - name: Move rolling tag to the published commit
        if: steps.meta.outputs.tag == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
            -f sha="$GITHUB_SHA" \
            -F force=true
