[package]
name = "mine_launcher"
version = "1.0.0"
edition = "2021"
description = "Простой лаунчер Minecraft: ник, версия, автозагрузка, запуск"
authors = ["MineLauncher"]

[dependencies]
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
uuid = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
dirs = "6"
thiserror = "2"
regex-lite = "0.1.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
