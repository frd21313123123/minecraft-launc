plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.36'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'minelauncher-skin-sync-neoforge-1.21.1'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
}

runs {
    configureEach {
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {
    }

    server {
        argument '--nogui'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes(
                'FMLModType': 'MOD',
                'Specification-Title': 'MineLauncher Skin Sync',
                'Specification-Version': '2',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version
        )
    }
}
