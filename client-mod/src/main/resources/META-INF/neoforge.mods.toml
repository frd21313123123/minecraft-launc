modLoader="javafml"
loaderVersion="[4,)"
license="MIT"

[[mods]]
modId="minelauncher_skin_sync"
version="2.0.1"
displayName="MineLauncher Skin Sync"
authors="MineLauncher"
description='''
Synchronizes PNG skins selected in MineLauncher through a NeoForge server or an integrated singleplayer server.
'''

[[mixins]]
config="minelauncher_skin_sync.mixins.json"

[[dependencies.minelauncher_skin_sync]]
modId="neoforge"
type="required"
versionRange="[21.1,22)"
ordering="NONE"
side="BOTH"

[[dependencies.minelauncher_skin_sync]]
modId="minecraft"
type="required"
versionRange="[1.21.1,1.21.2)"
ordering="NONE"
side="BOTH"

# Create performs some registrations during parallel mod construction. Loading
# after it prevents its registrate state from being observed half-initialized.
[[dependencies.minelauncher_skin_sync]]
modId="create"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"
